services:
  back:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.back
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../back:/app

  seed:
    volumes:
      - ../back:/app
      - ../back/migrations:/migrations:ro
      - ../deploy/init-db.sh:/scripts/init-db.sh:ro

  front:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host"]
    ports:
      - "5173:5173"
    volumes:
      - ../front:/app
      - front_node_modules:/app/node_modules

volumes:
  front_node_modules:
